name: Generate repository map

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run generate
        uses: mrf0rtuna4/TreeExporter@master
        with: 
          format: "svg"
          commit: "true"
          branch: "master"
          output: "structure.svg"
          
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
          echo "No changes."
          exit 0
          fi

          git commit -m "Update repository structure"
          git push