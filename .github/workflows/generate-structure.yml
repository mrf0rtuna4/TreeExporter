name: Generate repository map

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run generate
        uses: mrf0rtuna4/TreeExporter@master
        with: 
          commit: "true"
          branch: "master"

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add "structure.txt"

          if git diff --cached --quiet; then
          echo "No changes."
          exit 0
          fi

          git commit -m "Update repository structure"
          git push