[project]
name = "TreeExporter"
version = "0.1.0"
description = "Generate visual maps of repository structure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
tree-exporter = "tree_exporter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_exporter"]


[tool.ruff]
target-version = "py311"
line-length = 88

exclude = [
    ".git",
    ".venv",
    ".idea",
    ".vscode",
    "__pycache__",
]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "N",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "ANN",
    "ASYNC",
    "S",
    "DTZ",
    "PLE"
]

ignore = [
    "E501",
    "ANN101",
    "S101"
]