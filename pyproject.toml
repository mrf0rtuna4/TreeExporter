[project]
name = "TreeExporter"
version = "0.1.0"
description = "Generate visual maps of repository structure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
tree-exporter = "tree_exporter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_exporter"]